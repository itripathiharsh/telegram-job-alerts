name: Telegram Job Alerts

on:
  schedule:
    # 08:00 IST = 02:30 UTC
    - cron: "30 2 * * *"
    # 20:00 IST = 14:30 UTC
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-job-alerts
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python -m job_alerts.main

      - name: Commit deduplication state
        if: always()
        run: |
          if git diff --quiet -- job_alerts/state.json; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job_alerts/state.json
          git commit -m "Update job alert deduplication state [skip ci]"
          git push
